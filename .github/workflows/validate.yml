name: Validate control catalog
on:
  pull_request:
    paths: ["trust-center/controls/**", "scripts/**"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python scripts/validate_controls.py --crosswalks
      - name: Fail if crosswalks are stale
        run: git diff --exit-code -- trust-center/frameworks || (echo "Run validate_controls.py --crosswalks and commit" && exit 1)
